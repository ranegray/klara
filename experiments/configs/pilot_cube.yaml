# August sim pilot: reliability-versus-token sweep, ladder rungs 1-3.
# One task, fixed injected stressor, N episodes per rung.
task: cube_pick_place
backend: isaac
rungs: [1, 2, 3]
episodes_per_rung: 20
base_seed: 0            # episode i uses seed base_seed + i (pinned reset per seed)
model: TBD              # set before the sweep; recorded per episode
max_turns: 10
stressor:               # provenance: robo9 STS3215 characterization
  backlash_deg: 0.85
  repeatability_deg: 1.0
  deadband_counts: 10
  seed: 0
output: data/runs/pilot_cube.jsonl
