[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    # experiments/ scripts (not a package, so their deps live here):
    "pyyaml>=6",        # run_sweep.py config loading
    "matplotlib>=3.8",  # analysis/plot_frontier.py
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["packages", "experiments/tests"]
