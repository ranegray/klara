[project]
name = "klara-sim-isaac"
version = "0.1.0"
description = "Isaac Sim backend for the klara-core contract. The ONLY package allowed to import omni/isaacsim."
requires-python = ">=3.10"
dependencies = ["klara-core"]
# Isaac Sim itself is intentionally NOT a dependency here: it is provided by
# the Omniverse installation's bundled Python. See docs/SETUP.md.

[tool.uv.sources]
klara-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/klara_sim_isaac"]
