[project]
name = "klara-core"
version = "0.1.0"
description = "The KLARA contract: primitive API, result types, stressor model, episode records, traces. Pure Python — no sim, no ROS."
requires-python = ">=3.10"
dependencies = [
    "mcap>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/klara_core"]
